<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Maze</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f5f0df;
            --muted: #b6b09f;
            --panel: #171918;
            --panel-raised: #21241f;
            --line: #676b60;
            --accent: #efc75e;
        }
        * {
            box-sizing: border-box;
        }
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            margin: 0;
            padding:
                max(2px, env(safe-area-inset-top))
                max(2px, env(safe-area-inset-right))
                max(2px, env(safe-area-inset-bottom))
                max(2px, env(safe-area-inset-left));
            overflow: hidden;
            overscroll-behavior: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%) 0 0 / 24px 24px,
                linear-gradient(315deg, rgba(255, 255, 255, 0.025) 25%, transparent 25%) 0 0 / 24px 24px,
                #242722;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-wrapper {
            position: relative;
            display: grid;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            place-items: center;
        }
        main {
            display: grid;
            grid-template:
                "hud" auto
                "stage" minmax(0, 1fr)
                "message" auto
                "controls" auto
                / minmax(0, 1fr);
            gap: clamp(2px, 0.6vmin, 6px);
            width: min(100%, 1200px);
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

        /* ---------- Status board ---------- */
        #hud {
            grid-area: hud;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
            min-width: 0;
            min-height: 0;
            max-height: 24dvh;
            padding: 4px 52px 4px 5px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            font-variant-numeric: tabular-nums;
            line-height: 1.15;
            scrollbar-width: thin;
        }
        .hud-row {
            display: grid;
            gap: 3px;
            min-width: 0;
        }
        .hud-row-primary {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            font-size: clamp(12px, 3.4vw, 17px);
        }
        .hud-row-secondary {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            font-size: clamp(10px, 2.6vw, 13px);
        }
        .hud-stat {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 0 0.4em;
            align-items: center;
            min-width: 0;
            padding: 2px 5px;
            border-left: 3px solid var(--stat-accent, var(--accent));
            border-radius: 4px;
            background: var(--panel-raised);
        }
        .stat-icon {
            grid-row: span 2;
            color: var(--stat-accent, var(--accent));
            font-size: 1.15em;
            line-height: 1;
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.68em;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .stat-value {
            min-width: 0;
            overflow: hidden;
            color: var(--ink);
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hud-row-primary .stat-value {
            color: var(--stat-accent, var(--accent));
        }
        /* Small in-HUD affordances such as retargeting the tracked objective. */
        .stat-btn {
            grid-column: 3;
            grid-row: 1 / span 2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            min-height: 30px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
            color: var(--stat-accent, var(--accent));
            font-family: inherit;
            font-size: 1em;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
        }
        .stat-btn:active {
            background: var(--accent);
            color: var(--panel);
        }
        .stat-btn:focus-visible {
            outline: 2px solid #fff4b8;
            outline-offset: -2px;
        }
        .hud-stat:has(.stat-btn) {
            grid-template-columns: auto minmax(0, 1fr) auto;
        }
        [data-stat="health"] { --stat-accent: #ff7a70; }
        [data-stat="objective"] { --stat-accent: #6fd3ff; }
        [data-stat="exit"] { --stat-accent: #8fd66a; }
        [data-stat="money"] { --stat-accent: #efc75e; }
        [data-stat="level"] { --stat-accent: #cfd3c4; }
        [data-stat="weapon"] { --stat-accent: #ff9d5c; }
        [data-stat="mining"] { --stat-accent: #c9a77a; }
        [data-stat="pack"] { --stat-accent: #a8b0a2; }
        [data-stat="reinforcement"] { --stat-accent: #ef7ad0; }
        [data-stat="status"] { --stat-accent: #b78cff; }

        /* ---------- Stage ---------- */
        #canvas-stage {
            grid-area: stage;
            display: grid;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            place-items: center;
            line-height: 0;
            container-type: size;
        }
        #canvas-stage canvas {
            display: block;
            width: min(100cqw, 100cqh) !important;
            height: min(100cqw, 100cqh) !important;
            max-width: 100%;
            max-height: 100%;
            margin: 0 !important;
            aspect-ratio: 1;
            border: 2px solid #d5d0be;
            background: #f4f1e8;
            image-rendering: pixelated;
            touch-action: none;
        }
        #message {
            grid-area: message;
            width: 100%;
            min-width: 0;
            min-height: 1.3em;
            max-height: min(22dvh, 6em);
            margin: 0;
            padding: 2px 6px;
            overflow: auto;
            overflow-wrap: anywhere;
            color: #dce8a5;
            font-size: clamp(11px, 2.6vw, 15px);
            font-weight: bold;
            line-height: 1.2;
            scrollbar-width: thin;
            text-align: center;
        }

        /* ---------- Control deck ---------- */
        #control-deck {
            grid-area: controls;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: clamp(6px, 2vw, 14px);
            align-items: center;
            width: 100%;
            min-width: 0;
            min-height: 0;
            height: clamp(112px, 23dvh, 196px);
            padding: 5px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            touch-action: none;
        }
        /* Button-only schemes such as the card tables drop the pad column. */
        #control-deck[data-stick="none"] {
            grid-template-columns: minmax(0, 1fr);
        }
        #move-pad {
            position: relative;
            display: grid;
            grid-template-areas:
                ".    up    ."
                "left mid   right"
                ".    down  .";
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            aspect-ratio: 1;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(239, 199, 94, 0.14) 0 42%, transparent 43%),
                var(--panel-raised);
            box-shadow: inset 0 0 0 2px var(--line);
            touch-action: none;
        }
        .move-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--accent);
            font-family: inherit;
            font-size: clamp(20px, 6vw, 30px);
            line-height: 1;
            cursor: pointer;
            touch-action: none;
        }
        .move-btn:active,
        .move-btn[data-pressed="true"] {
            color: #fff4b8;
            text-shadow: 0 0 10px rgba(239, 199, 94, 0.9);
        }
        .move-btn:focus-visible {
            outline: 3px solid #fff4b8;
            outline-offset: -4px;
        }
        [data-direction="up"] { grid-area: up; }
        [data-direction="down"] { grid-area: down; }
        [data-direction="left"] { grid-area: left; }
        [data-direction="right"] { grid-area: right; }
        #move-stick {
            grid-area: mid;
            place-self: center;
            width: 76%;
            aspect-ratio: 1;
            border: 2px solid var(--accent);
            border-radius: 50%;
            background: #33372f;
            pointer-events: none;
            transition: transform 90ms ease-out;
        }
        #move-pad[data-active="true"] #move-stick {
            background: var(--accent);
            transition: none;
        }
        #action-column {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 5px;
            min-width: 0;
            height: 100%;
        }
        #action-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr);
            gap: 5px;
            min-width: 0;
            height: 100%;
        }
        #quick-slot-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 5px;
            min-width: 0;
        }
        .quick-slot-btn {
            flex-direction: row;
            gap: 4px;
            min-height: 44px;
        }
        .quick-slot-btn[data-filled="false"] {
            color: var(--muted);
            opacity: 0.72;
        }
        .action-label {
            overflow: hidden;
            max-width: 100%;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            gap: 1px;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 40px;
            padding: 2px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-left: 3px solid var(--stat-accent, var(--accent));
            border-radius: 5px;
            background: var(--panel-raised);
            color: var(--ink);
            font-family: inherit;
            font-size: clamp(10px, 2.5vw, 14px);
            cursor: pointer;
            touch-action: manipulation;
        }
        .action-btn .action-icon {
            color: var(--stat-accent, var(--accent));
            font-size: 1.35em;
            line-height: 1;
        }
        .action-btn:active,
        .action-btn[aria-pressed="true"] {
            background: var(--accent);
            color: var(--panel);
        }
        .action-btn[aria-pressed="true"] .action-icon {
            color: var(--panel);
        }
        .action-btn:focus-visible {
            outline: 3px solid #fff4b8;
            outline-offset: -3px;
        }

        /*
         * Very short viewports cannot fit a 44px quick-slot row plus two rows of
         * 40px actions inside the deck's clamped height, so the floors relax
         * rather than letting the deck push the pad off screen.
         */
        @media (max-height: 640px) {
            #control-deck {
                padding: 3px;
                gap: 4px;
            }
            #action-column,
            #action-pad,
            #quick-slot-row {
                gap: 4px;
            }
            .action-btn {
                min-height: 32px;
                font-size: clamp(9px, 2.2vw, 12px);
            }
            .quick-slot-btn {
                min-height: 32px;
            }
        }

        .hidden {
            display: none !important;
        }
        #menu-toggle-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel-raised);
            color: var(--ink);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        #menu-toggle-btn:hover {
            background: var(--accent);
            color: var(--panel);
        }
        #menu-toggle-btn:focus-visible {
            outline: 3px solid #fff4b8;
            outline-offset: -3px;
        }
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(15, 17, 14, 0.75);
        }
        .overlay-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 30;
            width: min(94vw, 520px);
            max-height: calc(100dvh - 12px);
            padding: clamp(18px, 6vmin, 40px) clamp(18px, 8vmin, 56px);
            overflow: auto;
            transform: translate(-50%, -50%);
            border: 1px solid var(--line);
            background: var(--panel);
            text-align: center;
        }
        .overlay-panel h1 {
            margin-top: 0;
            color: var(--accent);
            font-size: clamp(2rem, 10vmin, 3em);
            letter-spacing: 0.05em;
        }
        .hint {
            margin-bottom: clamp(16px, 5vmin, 28px);
            color: var(--muted);
            font-size: 0.85em;
        }
        .overlay-panel button {
            display: block;
            width: 100%;
            min-height: 44px;
            margin: 10px 0;
            padding: 14px 24px;
            border: 0;
            background: var(--accent);
            color: var(--panel);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15em;
            font-weight: bold;
            cursor: pointer;
        }
        .overlay-panel button:hover,
        .overlay-panel button:focus-visible {
            background: #d4a83f;
        }
        #overlay-backdrop-pause {
            cursor: pointer;
        }

        /* First-run tour. Sits above every other overlay so it can point at the
           HUD and the control deck, which are DOM siblings of the canvas. */
        #tutorial-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
        }
        #tutorial-spotlight {
            position: fixed;
            border: 2px solid var(--accent);
            border-radius: 6px;
            box-shadow: 0 0 0 9999px rgba(15, 17, 14, 0.78);
            pointer-events: none;
        }
        #tutorial-line {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #tutorial-line line {
            stroke: var(--accent);
            stroke-width: 3;
        }
        #tutorial-line path {
            fill: var(--accent);
        }
        #tutorial-card {
            position: fixed;
            width: min(92vw, 340px);
            padding: 16px 18px 12px;
            border: 1px solid var(--accent);
            background: var(--panel);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        }
        #tutorial-progress {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.75em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #tutorial-card h2 {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 1.15em;
        }
        #tutorial-body {
            margin: 0 0 14px;
            color: var(--ink);
            font-size: 0.9em;
            line-height: 1.45;
        }
        #tutorial-buttons {
            display: flex;
            gap: 8px;
        }
        #tutorial-buttons button {
            flex: 1;
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            background: var(--panel-raised);
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.9em;
            cursor: pointer;
        }
        #tutorial-next {
            background: var(--accent);
            color: var(--panel);
            font-weight: bold;
        }
        #tutorial-buttons button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        #tutorial-buttons button:focus-visible {
            outline: 3px solid #fff4b8;
            outline-offset: -3px;
        }

        /* Wide screens get a roomy, readable sidebar next to the maze. */
        @media (min-aspect-ratio: 4 / 3) {
            main {
                grid-template:
                    "stage hud" minmax(0, 1fr)
                    "stage message" auto
                    "stage controls" auto
                    / minmax(0, 1fr) clamp(220px, 27vw, 360px);
                width: min(100%, 1400px);
            }
            #hud {
                max-height: none;
                gap: 5px;
                padding: 52px 6px 5px;
            }
            .hud-row-primary {
                grid-template-columns: minmax(0, 1fr);
                font-size: clamp(14px, 1.55vw, 21px);
            }
            .hud-row-secondary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                font-size: clamp(11px, 1.1vw, 15px);
            }
            .hud-stat {
                padding: 3px 7px;
            }
            #message {
                max-height: 24dvh;
                padding-inline: 5px;
                font-size: clamp(12px, 1.15vw, 16px);
            }
            #control-deck {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto;
                justify-items: center;
                height: auto;
                min-height: 0;
            }
            #move-pad {
                height: clamp(72px, 15dvh, 116px);
            }
            #action-column {
                width: 100%;
                height: auto;
            }
            #action-pad {
                width: 100%;
                height: auto;
                grid-auto-rows: minmax(38px, auto);
            }
            .move-btn {
                font-size: clamp(18px, 2.2vw, 28px);
            }
            .action-btn {
                font-size: clamp(11px, 1vw, 14px);
            }
        }
    </style>
</head>
<body>
    <div id="overlay-backdrop" class="overlay-backdrop"></div>
    <div
        id="start-panel"
        class="overlay-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="start-title"
    >
        <h1 id="start-title">Maze</h1>
        <p class="hint">Enter the maze now to possibly win a horse.</p>
        <button id="start-btn" type="button">Start Game</button>
    </div>

    <div id="overlay-backdrop-pause" class="overlay-backdrop hidden"></div>
    <div
        id="pause-panel"
        class="overlay-panel hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pause-title"
    >
        <h1 id="pause-title">Paused</h1>
        <p class="hint">Press Escape or click outside to resume.</p>
        <button id="resume-btn" type="button">Resume</button>
        <button id="restart-btn" type="button">Restart Game</button>
    </div>

    <div
        id="tutorial-overlay"
        class="hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tutorial-title"
    >
        <div id="tutorial-spotlight" aria-hidden="true"></div>
        <svg id="tutorial-line" aria-hidden="true">
            <defs>
                <marker
                    id="tutorial-arrow"
                    markerWidth="8"
                    markerHeight="8"
                    refX="7"
                    refY="4"
                    orient="auto"
                >
                    <path d="M0,0 L8,4 L0,8 Z"></path>
                </marker>
            </defs>
            <line visibility="hidden" marker-end="url(#tutorial-arrow)"></line>
        </svg>
        <div id="tutorial-card">
            <p id="tutorial-progress"></p>
            <h2 id="tutorial-title"></h2>
            <p id="tutorial-body"></p>
            <div id="tutorial-buttons">
                <button id="tutorial-back" type="button">Back</button>
                <button id="tutorial-next" type="button">Next</button>
                <button id="tutorial-skip" type="button">Skip</button>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <main class="hidden" id="game-main">
            <div id="hud" aria-label="Player status">
                <div class="hud-row hud-row-primary">
                    <span class="hud-stat" data-stat="health">
                        <span class="stat-icon" aria-hidden="true">&#9829;</span>
                        <span class="stat-label">Health</span>
                        <span class="stat-value" id="health">10 / 10</span>
                    </span>
                    <span class="hud-stat" data-stat="objective">
                        <span class="stat-icon" aria-hidden="true">&#9670;</span>
                        <span class="stat-label">Objective</span>
                        <span class="stat-value" id="objective">Pipe</span>
                        <button
                            id="objective-cycle"
                            class="stat-btn"
                            type="button"
                            aria-label="Track the next objective"
                            title="Track the next objective"
                        >&#8635;</button>
                    </span>
                    <span class="hud-stat" data-stat="exit">
                        <span class="stat-icon" aria-hidden="true">&#9873;</span>
                        <span class="stat-label">Exit</span>
                        <span class="stat-value" id="exit-status">Locked 0 / 4</span>
                    </span>
                    <span class="hud-stat" data-stat="money">
                        <span class="stat-icon" aria-hidden="true">&#164;</span>
                        <span class="stat-label">Money</span>
                        <span class="stat-value" id="money">$40</span>
                    </span>
                </div>
                <div class="hud-row hud-row-secondary">
                    <span class="hud-stat" data-stat="level">
                        <span class="stat-icon" aria-hidden="true">&#9635;</span>
                        <span class="stat-label">Level</span>
                        <span class="stat-value" id="level">1</span>
                    </span>
                    <span class="hud-stat" data-stat="weapon">
                        <span class="stat-icon" aria-hidden="true">&#9876;</span>
                        <span class="stat-label">Weapon</span>
                        <span class="stat-value" id="weapon">Improvised 1</span>
                    </span>
                    <span class="hud-stat" data-stat="mining">
                        <span class="stat-icon" aria-hidden="true">&#9874;</span>
                        <span class="stat-label">Mining</span>
                        <span class="stat-value" id="mining">0 (0)</span>
                    </span>
                    <span class="hud-stat" data-stat="pack">
                        <span class="stat-icon" aria-hidden="true">&#9636;</span>
                        <span class="stat-label">Pack</span>
                        <span class="stat-value" id="backpack">1 / 8</span>
                    </span>
                    <span class="hud-stat" data-stat="reinforcement">
                        <span class="stat-icon" aria-hidden="true">&#9760;</span>
                        <span class="stat-label">Next foe</span>
                        <span class="stat-value" id="reinforcement">30&#8211;60s</span>
                    </span>
                    <span class="hud-stat" data-stat="status">
                        <span class="stat-icon" aria-hidden="true">&#10022;</span>
                        <span class="stat-label">Status</span>
                        <span class="stat-value" id="player-status">Clear</span>
                        <button
                            id="maze-help"
                            class="stat-btn"
                            type="button"
                            aria-label="Show the maze legend"
                            title="Show the maze legend"
                        >?</button>
                    </span>
                </div>
                <button
                    id="menu-toggle-btn"
                    class="hidden"
                    type="button"
                    aria-label="Open menu"
                    aria-controls="pause-panel"
                    aria-expanded="false"
                >&#9776;</button>
            </div>
            <div id="canvas-stage">
                <canvas
                    id="canvas"
                    aria-label="Maze game. Use arrow keys or WASD to move."
                ></canvas>
            </div>
            <p id="message" role="status" aria-live="polite" aria-atomic="true"></p>
            <div id="control-deck" class="hidden">
                <div
                    id="move-pad"
                    role="group"
                    aria-label="Movement pad. Tap an arrow or drag the stick."
                >
                    <button
                        class="move-btn"
                        type="button"
                        data-direction="up"
                        aria-label="Move up"
                    >&#8593;</button>
                    <button
                        class="move-btn"
                        type="button"
                        data-direction="left"
                        aria-label="Move left"
                    >&#8592;</button>
                    <div id="move-stick" aria-hidden="true"></div>
                    <button
                        class="move-btn"
                        type="button"
                        data-direction="right"
                        aria-label="Move right"
                    >&#8594;</button>
                    <button
                        class="move-btn"
                        type="button"
                        data-direction="down"
                        aria-label="Move down"
                    >&#8595;</button>
                </div>
                <div id="action-column">
                    <!-- Both groups are filled at runtime from the active
                         scene's control scheme. -->
                    <div
                        id="quick-slot-row"
                        class="hidden"
                        role="group"
                        aria-label="Quick slots"
                    ></div>
                    <div id="action-pad" role="group" aria-label="Actions"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
